<svg xmlns="http://www.w3.org/2000/svg" width="130" height="130" viewBox="0 0 130 130" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Ceiling light</title>
  <style>
    .dome { animation: glow 2.4s ease-in-out infinite; }
    .ray { animation: ray 2.4s ease-in-out infinite; }
    .r2 { animation-delay: 0.2s; }
    .r3 { animation-delay: 0.4s; }
    .side { animation: side 2.4s ease-in-out infinite; animation-delay: 0.6s; }
    @keyframes glow { 0%,100% { fill: #FFE7A3; } 50% { fill: #FFF6D6; } }
    @keyframes ray { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes side { 0%,100% { opacity: 0.1; } 50% { opacity: 0.6; } }
    @media (prefers-reduced-motion: reduce) {
      .dome, .ray, .side { animation: none; }
    }
  </style>
  <rect width="130" height="130" rx="22" fill="#161616"/>
  <rect x="18" y="16" width="94" height="6" rx="3" fill="#6E6E6E"/>
  <path class="dome" d="M28 22 Q65 66 102 22 Z" fill="#FFE7A3" stroke="#FFC24B" stroke-width="2.5"/>
  <g stroke="#FFC24B" stroke-linecap="round">
    <line class="ray" x1="40" y1="56" x2="30" y2="80" stroke-width="3"/>
    <line class="ray r2" x1="65" y1="66" x2="65" y2="94" stroke-width="3"/>
    <line class="ray r3" x1="90" y1="56" x2="100" y2="80" stroke-width="3"/>
    <line class="side" x1="20" y1="64" x2="14" y2="78" stroke-width="2"/>
    <line class="side" x1="110" y1="64" x2="116" y2="78" stroke-width="2"/>
  </g>
</svg>
